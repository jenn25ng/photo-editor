<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#fff4e6" />
  <title>아기랑 – 우리 아기 미디어 놀이터</title>

  <!-- 홈 화면 앱(PWA) 설정 -->
  <link rel="manifest" href="manifest.json" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="아기랑" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Gaegu:wght@400;700&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet" />

  <link rel="icon" type="image/png" href="icon-192.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- ===== 헤더 ===== -->
  <header class="app-header">
    <h1 class="logo">🍼 아기랑</h1>
    <p class="subtitle">우리 아기가 좋아하는 미디어, 시즌 순서대로 쭉!</p>
  </header>

  <!-- ===== 홈: 프로그램 목록 ===== -->
  <main id="home" class="view">
    <div class="home-hint">보고 싶은 캐릭터를 골라주세요 👇</div>
    <section id="showGrid" class="show-grid" aria-label="프로그램 목록"></section>
    <p class="disclaimer">
      모든 영상은 각 프로그램의 <strong>공식 유튜브 채널</strong>에서 무료로 공개한 재생목록을 불러와 보여줍니다.
      이 앱은 영상을 저장하거나 재배포하지 않아요.
    </p>
  </main>

  <!-- ===== 프로그램 상세: 시즌 목록 ===== -->
  <section id="showDetail" class="view hidden" aria-label="시즌 목록">
    <div class="detail-top">
      <button class="back-btn" data-action="home">← 목록</button>
      <div class="detail-title">
        <span id="detailEmoji" class="detail-emoji"></span>
        <div>
          <h2 id="detailTitle"></h2>
          <p id="detailTagline" class="detail-tagline"></p>
        </div>
      </div>
      <div id="langToggle" class="lang-toggle" role="group" aria-label="언어 선택"></div>
    </div>
    <div id="seasonList" class="season-list"></div>
  </section>

  <!-- ===== 플레이어 ===== -->
  <section id="player" class="view hidden" aria-label="영상 재생">
    <div class="player-top">
      <button class="back-btn" data-action="back-to-detail">← 시즌</button>
      <h2 id="playerTitle" class="player-title"></h2>
      <a id="openYoutube" class="yt-link" href="#" target="_blank" rel="noopener">유튜브에서 열기 ↗</a>
    </div>
    <div class="player-frame">
      <div id="playerSlot" class="player-slot"></div>
    </div>
    <p class="player-note">▶︎ 재생목록이 순서대로 자동 재생됩니다. 광고가 나올 수 있어요.</p>
  </section>

  <footer class="app-footer">
    <span>👶 아기랑</span> · 부모님이 골라주는 안전한 미디어 놀이터
    <a class="editor-link" href="./photo-editor/index.html">🎨 꾸미사진</a>
  </footer>

  <script src="data.js"></script>
  <script src="app.js"></script>
  <script>
    // 홈 화면 앱 · 오프라인 지원 (지원 브라우저에서만 동작)
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
